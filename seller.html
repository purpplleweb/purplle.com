<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#008069">
<meta name="robots" content="noindex">
<title>Seller Inbox</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#efeae2;color:#111;overflow:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit}
/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:#008069;overflow:auto}
.login form{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.login h1{margin:0 0 4px;font-size:20px}.login p{margin:0 0 16px;color:#667781;font-size:13.5px}
.login label{display:block;font-size:12.5px;font-weight:600;color:#54656f;margin:12px 0 4px}
.login input{width:100%;padding:12px;border:1px solid #cfd8dc;border-radius:8px;font-size:16px}
.login button{margin-top:18px;width:100%;min-height:46px;padding:12px;border:0;border-radius:8px;background:#00a884;color:#fff;font-weight:700}
.err{color:#d93025;font-size:13px;margin-top:10px;min-height:18px}
/* ---------- layout ---------- */
.app{height:100vh;height:100dvh;display:none;grid-template-columns:clamp(280px,30vw,420px) minmax(0,1fr);width:100%;max-width:1700px;margin:0 auto;background:#efeae2;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.app.on{display:grid}
@media (min-width:1500px) and (min-height:760px){
 body{background:#d1d7db}
 .app{height:calc(100dvh - 40px);margin-top:20px;border-radius:10px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.18)}
}
.side{background:#fff;border-right:1px solid #e3e3e3;display:flex;flex-direction:column;min-height:0;min-width:0}
.side header,.main header{background:#008069;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;min-height:60px;flex:none}
.side header{justify-content:space-between;font-weight:700;font-size:16px}
.side header button{background:none;border:0;color:#fff;font-size:13.5px;opacity:.95;padding:10px 6px;min-height:40px}
.list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.conv{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid #f0f2f5;cursor:pointer;align-items:center}
.conv:hover,.conv.on{background:#f0f2f5}
.conv img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd;flex:none}
.conv .t{flex:1;min-width:0}
.conv b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.conv span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#667781;font-size:13px}
.conv .u{background:#00a884;color:#fff;border-radius:999px;min-width:22px;height:22px;padding:0 6px;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.empty{padding:40px 20px;text-align:center;color:#667781}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.main header img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#fff;flex:none}
.main header>div{min-width:0;flex:1}
.main header b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main header small{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none;background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:6px 8px;margin-left:-6px;min-width:44px;min-height:44px}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background-image:radial-gradient(rgba(0,0,0,.045) 1px,transparent 1.2px);background-size:18px 18px}
.none{margin:auto;color:#667781;text-align:center;padding:20px}
/* ---------- messages ---------- */
.b{max-width:min(75%,640px);padding:6px 9px 4px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;position:relative;font-size:15px}
.b.in{align-self:flex-start;background:#fff;border-top-left-radius:0}
.b.out{align-self:flex-end;background:#d9fdd3;border-top-right-radius:0}
.b i{display:block;text-align:right;font-style:normal;font-size:11px;color:#667781;margin-top:2px;white-space:nowrap}
.b i.seen{color:#53bdeb}
.b img{width:clamp(110px,34vw,170px);max-width:100%;display:block}
.b.stk{background:none;box-shadow:none;padding:0}
.b audio{width:min(250px,100%);max-width:100%;height:38px;display:block}
.b .del{font-style:italic;color:#667781}
.b .x{position:absolute;top:2px;right:4px;border:0;background:rgba(255,255,255,.85);border-radius:50%;width:22px;height:22px;line-height:20px;font-size:14px;padding:0;color:#667781;opacity:0}
.b:hover .x,.b .x:focus{opacity:1}
@media (hover:none){.b .x{opacity:.75;width:28px;height:28px;line-height:26px;font-size:16px}.b{padding-right:12px}}
.sep{align-self:center;background:#fff;color:#54656f;font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
/* ---------- composer ---------- */
.send{display:flex;gap:8px;align-items:center;position:relative;flex:none;background:#f0f2f5;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.send input{flex:1;min-width:0;border:0;border-radius:22px;padding:12px 16px;font-size:16px;outline:0;min-height:46px}
.send button{width:46px;height:46px;border:0;border-radius:50%;background:#00a884;color:#fff;font-size:18px;flex:none;padding:0}
.send .ic{width:44px;height:44px;background:none;color:#54656f;font-size:22px}
.send .ic:hover{background:#e4e7ea}
.send .rec{display:none;flex:1;min-width:0;align-items:center;gap:10px;background:#fff;border-radius:22px;padding:0 8px 0 14px;height:46px}
.send .rec .dot{width:10px;height:10px;border-radius:50%;background:#e53935;animation:bl 1s infinite;flex:none}
@keyframes bl{50%{opacity:.25}}
.send .rec b{flex:1;font-variant-numeric:tabular-nums;font-weight:600}
.send .rec button{background:none;font-size:20px;color:#d93025;width:40px;height:40px}
.send.recording input,.send.recording #stb,.send.recording #mic{display:none}
.send.recording .rec{display:flex}
.panel{display:none;flex:none;background:#fff;border-top:1px solid #e3e3e3}
.panel.on{display:block}
.ptabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid #eee;align-items:center;overflow-x:auto}
.ptabs button{border:0;background:none;padding:8px 12px;min-height:38px;border-radius:8px;font-weight:700;color:#667781;font-size:13.5px;white-space:nowrap}
.ptabs button.on{background:#e7f6f2;color:#00a884}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:min(220px,34vh);max-height:min(220px,34dvh);overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.pgrid button{border:0;background:none;border-radius:12px;padding:4px;aspect-ratio:1}
.pgrid button:hover{background:#f0f2f5}
.pgrid img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.pgrid .add{border:2px dashed #b8c4cb;color:#00a884;font-size:30px}
.pgrid .em{grid-column:1/-1;text-align:center;color:#667781;padding:24px 10px;font-size:13px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.dlg div{background:#fff;border-radius:14px;padding:20px 20px 8px;width:100%;max-width:320px}
.dlg h4{margin:0 0 8px;font-size:17px}
.dlg button{display:block;margin-left:auto;background:none;border:0;color:#00856f;font-weight:700;padding:12px 8px;min-height:44px}
.dlg .bad{color:#d93025}
/* ---------- phones & small tablets: one pane at a time ---------- */
@media (max-width:760px){
 .app{grid-template-columns:minmax(0,1fr)}
 .app .main{display:none}
 .app.thread .side{display:none}.app.thread .main{display:flex}
 .back{display:block}
 .b{max-width:86%}
 .msgs{padding:10px 10px}
}
@media (max-width:380px){
 body{font-size:14px}
 .b{max-width:92%;font-size:14.5px}
 .conv{padding:10px 10px}.conv img{width:42px;height:42px}
 .send{gap:4px;padding-left:6px;padding-right:6px}
 .send .ic{width:40px}
 .pgrid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
 .login form{padding:18px}
}
/* short screens (phone in landscape, keyboard open) */
@media (max-height:520px){
 .side header,.main header{min-height:48px;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:6px}
 .pgrid{max-height:112px}
 .login{place-items:start center}
}
@media (min-width:1200px){.msgs{padding:16px 6%}}
</style>
</head>
<body>
<div class="login" id="login">
 <form id="lf">
  <h1>Seller Inbox</h1>
  <p>Reply to customer chats from your website.</p>
  <label for="api">Chat server address</label>
  <input id="api" value="https://yathra-chat.onrender.com/api/chat" autocomplete="off">
  <label for="key">Seller password (ADMIN_KEY)</label>
  <input id="key" type="password" autocomplete="current-password" required>
  <button>Open inbox</button>
  <div class="err" id="err"></div>
 </form>
</div>
<div class="app" id="app">
 <div class="side">
  <header><span>Customer chats</span><button id="out">Log out</button></header>
  <div class="list" id="list"></div>
 </div>
 <div class="main">
  <header><button class="back" id="back" aria-label="Back">&#8592;</button><img id="pimg" alt="" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'"><div style="min-width:0"><b id="pname">Select a chat</b><small id="pprice"></small></div></header>
  <div class="msgs" id="msgs"><div class="none">Pick a customer chat on the left.</div></div>
  <div class="panel" id="panel"><div class="ptabs"><button type="button" data-t="pip" class="on">Pip</button><button type="button" data-t="mine">My stickers</button></div><div class="pgrid" id="pgrid"></div></div>
  <form class="send" id="sf" style="display:none"><button type="button" class="ic" id="stb" aria-label="Stickers">&#128578;</button><input id="txt" placeholder="Type a reply" autocomplete="off" maxlength="2000"><div class="rec"><span class="dot"></span><b id="rt">0:00</b><button type="button" id="rc" aria-label="Cancel recording">&#128465;</button></div><button type="button" class="ic" id="mic" aria-label="Record voice message">&#127908;</button><button id="sbtn" aria-label="Send">&#10148;</button></form>
  <input type="file" id="file" accept="image/*" multiple hidden>
 </div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var C1='#9b5de5',C2='#7a3dc4',DK='#2b1646',BEL='#ead8ff',PK='#ff8fb1',YL='#ffd23f',RD='#ff5d73',BL='#5ec8ff';
  function S(o,tag,at,f){return '<'+tag+' '+at+(o?' fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"':' fill="'+f+'"')+'/>'}
  function ell(o,x,y,rx,ry,f,r){return S(o,'ellipse','cx="'+x+'" cy="'+y+'" rx="'+rx+'" ry="'+ry+'"'+(r?' transform="rotate('+r+' '+x+' '+y+')"':''),f)}
  function pth(o,d,f,tr){return S(o,'path','d="'+d+'"'+(tr?' transform="'+tr+'"':''),f)}
  function rct(o,x,y,w,h,rx,f,r){return S(o,'rect','x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+rx+'"'+(r?' transform="rotate('+r+' '+(x+w/2)+' '+(y+h/2)+')"':''),f)}
  function ln(o,d,w,c,tr){return o?'':'<path d="'+d+'" fill="none" stroke="'+(c||DK)+'" stroke-width="'+(w||9)+'" stroke-linecap="round" stroke-linejoin="round"'+(tr?' transform="'+tr+'"':'')+'/>'}
  function txt(o,x,y,s,size,f,rot){return '<text x="'+x+'" y="'+y+'" font-size="'+size+'" font-weight="900" font-family="Arial Black,Arial,Helvetica,sans-serif" text-anchor="middle"'+(rot?' transform="rotate('+rot+' '+x+' '+y+')"':'')+(o?' fill="#fff" stroke="#fff" stroke-width="30" stroke-linejoin="round"':' fill="'+f+'"')+'>'+s+'</text>'}
  var HEART='M0 14C-34-10-24-40 0-20C24-40 34-10 0 14Z',STAR='M0-24L7-8L24-7L11 4L15 22L0 12L-15 22L-11 4L-24-7L-7-8Z',SPARK='M0-22Q3-3 22 0Q3 3 0 22Q-3 3-22 0Q-3-3 0-22Z';
  function at(x,y,s){return 'translate('+x+' '+y+') scale('+s+')'}
  function arms(o,t){
    if(t==='up')return ell(o,96,214,30,52,C1,-28)+ell(o,416,214,30,52,C1,28);
    if(t==='wave')return ell(o,108,306,30,48,C1,24)+ell(o,424,212,30,54,C1,34);
    if(t==='thumb')return ell(o,108,306,30,48,C1,24)+ell(o,408,292,36,44,C1,-8)+ell(o,428,236,17,36,C1,10);
    return ell(o,108,306,30,48,C1,24)+ell(o,404,306,30,48,C1,-24);
  }
  var EL=[205,262],ER=[307,262];
  function eyes(t){
    function open(p,s){return ell(0,p[0],p[1],27*s,33*s,'#fff')+ell(0,p[0]+2,p[1]+(t==='sad'?-3:4),15*s,19*s,DK)+ell(0,p[0]+8,p[1]-4,5,5,'#fff')}
    if(t==='heart')return pth(0,HEART,RD,at(EL[0],EL[1]+2,1.5))+pth(0,HEART,RD,at(ER[0],ER[1]+2,1.5));
    if(t==='happy')return ln(0,'M176 270Q205 224 234 270',11)+ln(0,'M278 270Q307 224 336 270',11);
    if(t==='star')return pth(0,STAR,YL,at(EL[0],EL[1],1.7))+pth(0,STAR,YL,at(ER[0],ER[1],1.7));
    if(t==='wide')return open(EL,1.2)+open(ER,1.2);
    if(t==='sleep')return ln(0,'M178 258Q205 284 232 258',10)+ln(0,'M280 258Q307 284 334 258',10);
    if(t==='wink')return open(EL,1)+ln(0,'M280 270Q307 228 334 270',11);
    return open(EL,1)+open(ER,1);
  }
  function mouth(t){
    if(t==='grin')return pth(0,'M204 316Q256 408 308 316Q256 334 204 316Z','#5a1f3d')+ell(0,256,372,24,13,'#ff8fa3');
    if(t==='o')return ell(0,256,352,21,28,'#5a1f3d');
    if(t==='frown')return ln(0,'M218 356Q256 322 294 356',10);
    if(t==='tiny')return ln(0,'M232 336Q256 352 280 336',9);
    return ln(0,'M212 328Q256 376 300 328',10);
  }
  var PIP=[
   {cap:'Hello!',e:'open',m:'grin',a:'wave',p:function(o){return ln(o,'M470 150q14 14 0 32M488 134q26 32 0 64',9)+ln(o,'M30 120q-12 14 0 30',9)}},
   {cap:'Love it!',e:'heart',m:'smile',p:function(o){return pth(o,HEART,RD,at(74,130,1.5))+pth(o,HEART,PK,at(452,112,1.2))+pth(o,HEART,RD,at(256,62,1))+pth(o,HEART,PK,at(430,214,.8))}},
   {cap:'Thank you',e:'happy',m:'smile',p:function(o){return ell(o,236,384,27,36,C1,-22)+ell(o,276,384,27,36,C1,22)+pth(o,SPARK,YL,at(86,160,1.4))+pth(o,SPARK,YL,at(436,120,1.1))+pth(o,SPARK,YL,at(410,230,.7))}},
   {cap:'Yay!',e:'happy',m:'grin',a:'up',p:function(o){return rct(o,60,96,22,12,3,RD,-30)+rct(o,430,60,22,12,3,BL,25)+rct(o,300,34,22,12,3,YL,10)+ell(o,170,60,9,9,PK)+ell(o,372,96,9,9,YL)+ell(o,40,190,8,8,BL)+ell(o,478,200,8,8,RD)+rct(o,140,24,20,11,3,BL,-50)+rct(o,460,128,20,11,3,PK,40)}},
   {cap:'Sounds good',e:'wink',m:'smile',a:'thumb',p:function(o){return pth(o,SPARK,YL,at(70,150,1.1))+pth(o,SPARK,YL,at(462,150,.8))}},
   {cap:'Wow!',e:'wide',m:'o',p:function(o){return ln(o,'M256 78v-40M184 92l-22-34M328 92l22-34M118 128l-34-20M394 128l34-20',11,YL)}},
   {cap:'Tell me more',e:'open',m:'tiny',p:function(o){return ln(0,'M280 214q27-20 54-2',9)+txt(o,432,150,'?',130,YL,14)+txt(0,432,150,'?',130,YL,14)}},
   {cap:'Sorry',e:'sad',m:'frown',p:function(o){return ln(0,'M176 216q28-18 56 0M280 216q28-18 56 0',9)+pth(o,'M172 316C150 346 156 366 172 366C188 366 194 346 172 316Z',BL)}},
   {cap:'Later?',e:'sleep',m:'tiny',p:function(o){return txt(o,400,150,'z',70,BL,-8)+txt(o,448,108,'Z',86,BL,-8)+txt(o,372,60,'z',50,BL,-8)}},
   {cap:'Add to bag',e:'happy',m:'smile',p:function(o){return rct(o,330,300,106,118,12,RD)+ln(o,'M362 304v-30q0-26 21-26t21 26v30',10,DK)+ln(o,'M356 354q28 22 56 0',9,'#fff')}},
   {cap:'On its way',e:'open',m:'grin',p:function(o){return rct(o,176,332,160,112,10,'#d9a066')+rct(o,236,332,40,112,0,'#f1c27d')+ln(o,'M28 330h96M10 372h82M40 414h74',11,BL)}},
   {cap:'Best deal',e:'star',m:'grin',p:function(o){return rct(o,336,92,140,84,18,YL,-14)+ln(o,'M356 128l22 20',0)+txt(o,408,150,'%',64,DK,-14)+pth(o,SPARK,PK,at(66,150,1.3))+pth(o,SPARK,YL,at(120,66,.9))}}
  ];
  function pipSvg(d){
    function layer(o){
      var s=ell(o,140,168,40,40,C1)+ell(o,372,168,40,40,C1);
      if(!o)s+=ell(0,140,170,22,22,'#f6bddb')+ell(0,372,170,22,22,'#f6bddb');
      s+=ell(o,200,420,52,28,C2)+ell(o,312,420,52,28,C2)+arms(o,d.a)+ell(o,256,288,152,140,C1);
      if(!o)s+=ell(0,256,338,92,70,BEL)+ell(0,160,318,20,15,PK)+ell(0,352,318,20,15,PK)+eyes(d.e)+mouth(d.m);
      return s+d.p(o);
    }
    var g=' transform="translate(256 226) scale(.8) translate(-256 -280)"',sz=Math.min(62,Math.floor(470/(d.cap.length*.66)));
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><g'+g+'>'+layer(true)+'</g><g'+g+'>'+layer(false)+'</g>'+txt(true,256,486,d.cap,sz)+txt(false,256,486,d.cap,sz,DK)+'</svg>';
  }
  var pipCache={};
  function pipSrc(i){return pipCache[i]||(pipCache[i]='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(pipSvg(PIP[i])))}

  function idb(){return new Promise(function(res,rej){if(!window.indexedDB)return rej(new Error('no idb'));var q=indexedDB.open('pchat-stk',1);q.onupgradeneeded=function(){q.result.createObjectStore('mine',{keyPath:'id'})};q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})}
  function idbDo(mode,fn){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('mine',mode),r=fn(tx.objectStore('mine'));tx.oncomplete=function(){res(r&&r.result)};tx.onerror=tx.onabort=function(){rej(tx.error)}})})}

  function makeSticker(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),im=new Image();
      im.onload=function(){
        URL.revokeObjectURL(url);
        var N=512,P=34,box=N-P*2,w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)return rej();
        var k=Math.min(box/w,box/h),dw=Math.round(w*k),dh=Math.round(h*k),dx=Math.round((N-dw)/2),dy=Math.round((N-dh)/2);
        var a=document.createElement('canvas');a.width=dw;a.height=dh;var ax=a.getContext('2d');ax.drawImage(im,0,0,dw,dh);
        var opaque=true;try{var d=ax.getImageData(0,0,dw,dh).data;for(var i=3;i<d.length;i+=4*37){if(d[i]<250){opaque=false;break}}}catch(e){}
        if(opaque){ /* photo: round the corners so the border looks like a sticker */
          var r=Math.round(Math.min(dw,dh)*.14);ax.globalCompositeOperation='destination-in';ax.beginPath();
          ax.moveTo(r,0);ax.arcTo(dw,0,dw,dh,r);ax.arcTo(dw,dh,0,dh,r);ax.arcTo(0,dh,0,0,r);ax.arcTo(0,0,dw,0,r);ax.closePath();ax.fill();ax.globalCompositeOperation='source-over';
        }
        var sil=document.createElement('canvas');sil.width=dw;sil.height=dh;var sx=sil.getContext('2d');sx.drawImage(a,0,0);sx.globalCompositeOperation='source-in';sx.fillStyle='#fff';sx.fillRect(0,0,dw,dh);
        var c=document.createElement('canvas');c.width=c.height=N;var x=c.getContext('2d');
        x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=8;x.shadowOffsetY=3;

  var API='',KEY='',cid=null,cursor=0,msgs={},timers=[];
  try{API=localStorage.getItem('seller:api')||'';KEY=sessionStorage.getItem('seller:key')||''}catch(e){}

  function http(method,path,body){

  }

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

  $('lf').onsubmit=function(e){
    e.preventDefault();API=$('api').value.trim().replace(/\/+$/,'');KEY=$('key').value.trim();$('err').textContent='';

    }).catch(function(er){$('err').textContent=er.status===401?'Wrong seller password.':'Could not reach the server. Check the address and try again (the first try can take up to a minute).'});
  };
  $('out').onclick=function(){try{sessionStorage.removeItem('seller:key')}catch(e){}location.reload()};
  function start(){
    $('login').style.display='none';$('app').classList.add('on');
    loadList();timers.push(setInterval(loadList,4000));timers.push(setInterval(poll,2500));
  }
  if(API&&KEY){http('GET','/conversations').then(start).catch(function(){})}

  function loadList(){
    http('GET','/conversations').then(function(r){
      var l=$('list');
      if(!r.conversations.length){l.innerHTML='<div class="empty">No customer chats yet.</div>';return}
      l.innerHTML='';

        var d=document.createElement('div');d.className='conv'+(c.id===cid?' on':'');
        var last=c.last?(c.last.deleted?'Message deleted':c.last.type==='sticker'?'Sticker':c.last.type==='voice'?'Voice message':c.last.text):'';
        var unread=(c.unread&&c.id!==cid)?'<div class="u">'+c.unread+'</div>':'';
        d.innerHTML='<img alt="" onerror="this.style.visibility=\'hidden\'" src="'+(c.image||'').replace(/"/g,'')+'"><div class="t"><b>'+esc(c.customerName||'Customer')+'</b><span style="color:#00856f;font-size:12px">'+esc(c.productName||'Product')+'</span><span>'+esc(last)+'</span></div>'+unread;
        d.onclick=function(){openConv(c)};l.appendChild(d);
      });
    }).catch(function(){});
  }
  function openConv(c){
    cid=c.id;cursor=0;msgs={};$('msgs').innerHTML='';
    $('pname').textContent=c.customerName||'Customer';$('pprice').textContent=(c.productName||'Product')+(c.price?' · ₹'+c.price:'');$('pimg').src=c.image||'';
    $('sf').style.display='flex';$('app').classList.add('thread');if(innerWidth<=760&&!threadPushed){try{history.pushState({sthread:1},'');threadPushed=true}catch(e){}}loadList();poll();if(innerWidth>760)$('txt').focus();
  }
  var threadPushed=false;
  function closeThread(){$('app').classList.remove('thread');cid=null;$('panel').classList.remove('on');loadList()}
  $('back').onclick=function(){if(threadPushed){try{history.back();return}catch(e){}}closeThread()};
  /* phone Back button goes from a chat back to the chat list instead of leaving the page */
  addEventListener('popstate',function(){if(threadPushed){threadPushed=false;closeThread()}});
  function poll(){
    if(!cid)return;var c=cid;
    http('GET','/conversations/'+c+'/messages?since='+cursor).then(function(r){
      if(c!==cid)return;
      if(r.cursor)cursor=r.cursor;
      r.messages.forEach(function(m){msgs[m.id]=m});
      if(r.messages.length)render();
    }).catch(function(){});
  }
  function render(){
    var box=$('msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<100;
    var arr=Object.keys(msgs).map(function(k){return msgs[k]}).filter(function(m){return !m.hidden}).sort(function(a,b){return a.at-b.at});
    box.innerHTML='';
    if(!arr.length){box.innerHTML='<div class="none">No messages yet.</div>';return}
    var last='';
    arr.forEach(function(m){
      var k=dayKey(m.at);if(k!==last){var s=document.createElement('div');s.className='sep';s.textContent=dayLabel(m.at);box.appendChild(s);last=k}
      var mine=m.sender==='seller',b=document.createElement('div');b.className='b '+(mine?'out':'in');

      else if(m.type==='sticker'){body=document.createElement('img');body.src=m.media;body.alt='Sticker';b.classList.add('stk')}
      else if(m.type==='voice'){body=document.createElement('audio');body.controls=true;body.preload='none';body.src=m.media}
      else{body=document.createElement('span');body.textContent=m.text}
      b.appendChild(body);
      var i=document.createElement('i');i.textContent=tm(m.at)+(mine?(m.status==='seen'?' ✓✓':m.status==='delivered'?' ✓✓':' ✓'):'');if(mine&&m.status==='seen')i.className='seen';b.appendChild(i);
      var x=document.createElement('button');x.className='x';x.type='button';x.setAttribute('aria-label','Delete message');x.textContent='×';x.onclick=function(){askDel(m)};b.appendChild(x);
      box.appendChild(b);
    });
    if(near||box.dataset.first!==cid){box.scrollTop=box.scrollHeight;box.dataset.first=cid}
  }
  function askDel(m){
    var d=document.createElement('div');d.className='dlg';var inner=document.createElement('div');d.appendChild(inner);
    inner.innerHTML='<h4>Delete message?</h4>';
    function btn(t,cls,fn){var b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=function(){d.remove();if(fn)fn()};inner.appendChild(b)}
    if(m.sender==='seller'&&!m.deleted&&Date.now()-m.at<48*3600*1000)btn('Delete for everyone','',function(){del(m,'all')});
    btn('Delete for me','',function(){del(m,'me')});btn('Cancel','bad');
    d.onclick=function(e){if(e.target===d)d.remove()};document.body.appendChild(d);
  }
  function del(m,scope){
    http('POST','/conversations/'+cid+'/messages/'+m.id+'/delete',{scope:scope}).then(function(){cursor=0;poll()}).catch(function(e){alert(e.status===403?'Too late to delete for everyone.':'Could not delete. Try again.')});
  }
  function upload(blob){return fetch(API+'/admin/conversations/'+cid+'/media',{method:'POST',headers:{'x-admin-key':KEY,'Content-Type':blob.type||'application/octet-stream'},body:blob}).then(function(r){if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()}).then(function(j){return j.url})}
  function sendMsg(body){
    if(!cid)return Promise.resolve();
    body.id=uid();body.at=Date.now();
    return http('POST','/conversations/'+cid+'/messages',body).then(function(r){msgs[r.message.id]=r.message;render();$('msgs').scrollTop=$('msgs').scrollHeight;loadList()}).catch(function(e){alert(e.status===413?'File is too large to send.':'Message not sent. Check your connection and try again.')});
  }
  $('sf').onsubmit=function(e){
    e.preventDefault();if(rec){stopRec(true);return}var t=$('txt').value.trim();if(!t||!cid)return;$('txt').value='';
    sendMsg({type:'text',text:t}).then(function(){});
  };
  /* ---- stickers ---- */
  var upSt={},ptab='pip',MINE=[];
  function rasterize(src){return new Promise(function(res,rej){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(im,0,0,512,512);c.toBlob(function(b){b?res(b):rej()},'image/webp',.92)};im.onerror=rej;im.src=src})}
  function dataBlob(src){return fetch(src).then(function(r){return r.blob()})}
  function sendSticker(key,src){
    if(!cid)return;
    var p=upSt[key]?Promise.resolve(upSt[key]):(src.indexOf('image/svg')>-1?rasterize(src):dataBlob(src)).then(upload).then(function(u){upSt[key]=u;return u});
    p.then(function(u){return sendMsg({type:'sticker',media:u})}).catch(function(){alert('Could not send sticker. Try again.')});
  }
  function renderGrid(){
    var g=$('pgrid');g.innerHTML='';
    if(ptab==='pip'){PIP.forEach(function(d,i){var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',d.cap);b.innerHTML='<img alt="">';b.firstChild.src=pipSrc(i);b.onclick=function(){sendSticker('pip:'+i,pipSrc(i))};g.appendChild(b)});return}
    var a=document.createElement('button');a.type='button';a.className='add';a.textContent='+';a.setAttribute('aria-label','Create sticker from image');a.onclick=function(){$('file').value='';$('file').click()};g.appendChild(a);
    MINE.forEach(function(it){var b=document.createElement('button');b.type='button';b.innerHTML='<img alt="">';b.firstChild.src=it.src;b.title='Click to send. Right-click or long-press to delete.';b.onclick=function(){sendSticker(it.id,it.src)};
      b.oncontextmenu=function(e){e.preventDefault();if(confirm('Delete this sticker?'))idbDo('readwrite',function(s){return s.delete(it.id)}).then(function(){MINE=MINE.filter(function(x){return x.id!==it.id});renderGrid()})};g.appendChild(b)});
    if(!MINE.length){var e=document.createElement('div');e.className='em';e.textContent='Tap + to turn any photo or image into a sticker. WhatsApp .webp stickers saved on your device work too.';g.appendChild(e)}
  }
  function loadMine(){return idbDo('readonly',function(s){return s.getAll()}).then(function(a){MINE=(a||[]).sort(function(x,y){return y.at-x.at});renderGrid()}).catch(function(){})}
  $('file').onchange=function(){
    var fl=Array.prototype.slice.call(this.files).filter(function(f){return /^image\//.test(f.type)}).slice(0,10);
    fl.reduce(function(p,f){return p.then(function(){return makeSticker(f).then(function(src){var it={id:'u:'+uid(),src:src,at:Date.now()};return idbDo('readwrite',function(s){return s.put(it)}).then(function(){MINE.unshift(it)})}).catch(function(){})})},Promise.resolve()).then(renderGrid);
  };
  $('stb').onclick=function(){var on=!$('panel').classList.contains('on');$('panel').classList.toggle('on',on);if(on){renderGrid();loadMine()}};
  Array.prototype.forEach.call(document.querySelectorAll('.ptabs button'),function(b){b.onclick=function(){ptab=b.getAttribute('data-t');Array.prototype.forEach.call(document.querySelectorAll('.ptabs button'),function(x){x.classList.toggle('on',x===b)});renderGrid()}});
  /* ---- voice ---- */
  var rec=null;
  function fmt(s){s=Math.round(s);return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
  function stopRec(send){if(!rec)return;rec.send=send;try{rec.mr.stop()}catch(e){}}
  $('rc').onclick=function(){stopRec(false)};
  $('mic').onclick=function(){
    if(rec)return;
    if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){alert('Voice messages are not supported on this browser.');return}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mt='';['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].some(function(t){if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t)){mt=t;return true}});
      var mr=mt?new MediaRecorder(stream,{mimeType:mt,audioBitsPerSecond:24000}):new MediaRecorder(stream);
      var r=rec={mr:mr,chunks:[],t0:Date.now(),send:false};
      mr.ondataavailable=function(e){if(e.data&&e.data.size)r.chunks.push(e.data)};
      mr.onstop=function(){
        clearInterval(r.iv);stream.getTracks().forEach(function(t){t.stop()});$('sf').classList.remove('recording');rec=null;
        var dur=(Date.now()-r.t0)/1000;if(!r.send)return;if(dur<0.7){alert('Recording too short.');return}
        var blob=new Blob(r.chunks,{type:(mr.mimeType||mt||'audio/webm').split(';')[0]});
        upload(blob).then(function(u){return sendMsg({type:'voice',media:u,dur:Math.min(dur,120)})}).catch(function(){alert('Could not send voice message. Try again.')});

  };
